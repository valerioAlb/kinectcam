name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows only: the project talks to a Windows-only runtime.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        # The runner has no Kinect runtime and no sensor, which is exactly what
        # the suite is built for: the tests needing real hardware skip
        # themselves, and the vtable indices are still checked against the
        # method order declared in Kinect.h.
        run: |
          python tests/test_offline.py
          python tests/test_scanning.py
          python tests/test_gui.py
